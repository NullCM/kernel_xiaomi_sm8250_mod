name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'thyme'
        type: choice
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      ksu:
        description: 'Enable KernelSU (BakaSU + SUSFS inline hook)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    # [FIX-1] 不要用 ubuntu-latest：2026-11 起它指向 26.04，只有 libxml2.so.16。
    #         noble(24.04) 是最后一个提供 libxml2.so.2 的 Ubuntu 版本。
    runs-on: ubuntu-24.04
    timeout-minutes: 120            # [可选] 防止卡死占用 6 小时额度

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # [FIX-2] 末尾新增 libxml2：为预编译 ld.lld 提供 libxml2.so.2
          #         apt 会自动带上 libicu 等依赖，无需手动处理
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio \
            libssl-dev libelf-dev ccache gawk python-is-python3 libxml2

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: kernel-ccache-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-${{ inputs.device }}-
            kernel-ccache-

      - name: Setup Toolchain
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          echo "c11341a58e15cebc4e25472291791ae6a5dceb3675c9dfde2cb035ad893b6ae0  Clang-16.0.6-20260807.tar.gz" | sha256sum -c -
          tar -zxf Clang-16.0.6-20260807.tar.gz
          rm -f Clang-16.0.6-20260807.tar.gz

      # [可选] fail-fast 自检：任何工具链二进制缺动态库都在这里立刻报错，
      #        而不是等 make 跑到 vdso_prepare 才吐 Error 127。整步可删。
      - name: Verify Toolchain Runtime Deps
        run: |
          export PATH="$HOME/zyc-clang/bin:$PATH"
          echo "== host =="
          lsb_release -ds
          echo "== libxml2 on host =="
          ldconfig -p | grep libxml2 || true

          fail=0
          ESSENTIAL="clang ld.lld llvm-ar llvm-nm llvm-objcopy aarch64-linux-gnu-ld arm-linux-gnueabi-ld"
          OPTIONAL="llvm-objdump llvm-strip"

          for b in $ESSENTIAL; do
            p=$(command -v "$b") || { echo "MISSING (required): $b"; fail=1; continue; }
            if ldd "$p" 2>/dev/null | grep -q "not found"; then
              echo "UNRESOLVED DEPS: $b"; ldd "$p"; fail=1
            fi
          done
          for b in $OPTIONAL; do
            p=$(command -v "$b") || { echo "MISSING (optional): $b"; continue; }
            if ldd "$p" 2>/dev/null | grep -q "not found"; then
              echo "WARN unresolved deps: $b"; ldd "$p"
            fi
          done

          [ "$fail" -eq 0 ] || { echo "Toolchain not usable, aborting."; exit 1; }
          clang --version | head -n1
          ld.lld --version
          aarch64-linux-gnu-ld --version | head -n1

      - name: Build Kernel
        run: |
          if [ "${{ inputs.ksu }}" = "true" ]; then
            echo "Building with BakaSU/SUSFS + BBG..."
            bash build.sh "${{ inputs.device }}" ksu
          else
            echo "Building without KernelSU (BBG included)..."
            bash build.sh "${{ inputs.device }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.device }}-${{ inputs.ksu && 'KSU' || 'NoKSU' }}-${{ github.run_number }}
          path: ./*.zip
          if-no-files-found: error

      - name: Upload Debug Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ inputs.device }}-${{ github.run_number }}
          path: |
            out/.config
            build.log
            susfs_hook.log
            **/*.rej
          if-no-files-found: ignore
